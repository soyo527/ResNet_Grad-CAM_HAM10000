<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>皮肤疾病分类系统 - 集成模型推理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        @media (max-width: 900px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
        
        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        .card-title {
            font-size: 1.3rem;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
        }
        
        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }
        
        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8ebff;
            transform: scale(1.02);
        }
        
        .upload-icon {
            font-size: 48px;
            color: #667eea;
            margin-bottom: 15px;
        }
        
        .upload-text {
            color: #666;
            font-size: 1rem;
        }
        
        .upload-hint {
            color: #999;
            font-size: 0.85rem;
            margin-top: 10px;
        }
        
        #fileInput {
            display: none;
        }
        
        .preview-image {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            width: 100%;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .result-section {
            display: none;
        }
        
        .prediction-main {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            color: white;
            margin-bottom: 20px;
        }
        
        .prediction-label {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-bottom: 5px;
        }
        
        .prediction-class {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .prediction-confidence {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .probabilities {
            margin-top: 20px;
        }
        
        .prob-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .prob-label {
            width: 120px;
            font-size: 0.9rem;
            color: #555;
        }
        
        .prob-bar-container {
            flex: 1;
            height: 24px;
            background: #f0f0f0;
            border-radius: 12px;
            overflow: hidden;
            margin: 0 10px;
        }
        
        .prob-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 8px;
        }
        
        .prob-value {
            font-size: 0.8rem;
            color: white;
            font-weight: bold;
        }
        
        .model-info {
            background: #f8f9ff;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
        }
        
        .model-info h4 {
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .model-info p {
            color: #666;
            font-size: 0.9rem;
            margin: 5px 0;
        }
        
        .single-models {
            margin-top: 20px;
        }
        
        .single-model-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: #f8f9ff;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        
        .single-model-name {
            color: #667eea;
            font-weight: bold;
        }
        
        .single-model-pred {
            color: #333;
        }
        
        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }
        
        .strategy-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .strategy-tab {
            flex: 1;
            padding: 10px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }
        
        .strategy-tab.active {
            background: #667eea;
            color: white;
        }
        
        .strategy-content {
            display: none;
        }
        
        .strategy-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>皮肤疾病分类系统</h1>
            <p>基于集成学习的深度学习模型推理平台</p>
        </div>
        
        <div class="main-content">
            <div class="card">
                <h2 class="card-title">上传图像</h2>
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📤</div>
                    <div class="upload-text">点击或拖拽上传皮肤图像</div>
                    <div class="upload-hint">支持 JPG、PNG 格式</div>
                </div>
                <input type="file" id="fileInput" accept="image/*">
                <img id="previewImage" class="preview-image" alt="预览">
                <button class="btn" id="predictBtn" disabled>开始推理</button>
                <div class="error-message" id="errorMessage"></div>
            </div>
            
            <div class="card">
                <h2 class="card-title">推理结果</h2>
                
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>正在进行集成推理...</p>
                </div>
                
                <div class="result-section" id="resultSection">
                    <div class="prediction-main">
                        <div class="prediction-label">预测结果</div>
                        <div class="prediction-class" id="predictionClass">-</div>
                        <div class="prediction-confidence" id="predictionConfidence">-</div>
                    </div>
                    
                    <div class="heatmap-section" style="margin: 20px 0;">
                        <h4 style="margin-bottom: 15px; color: #333;">热力图分析</h4>
                        <div style="text-align: center;">
                            <img id="heatmapImage" style="max-width: 100%; max-height: 400px; border-radius: 8px; display: none;" alt="热力图">
                            <p id="heatmapHint" style="color: #666; font-size: 0.9rem; margin-top: 10px;">热力图显示模型关注的区域，红色表示高关注度</p>
                        </div>
                    </div>
                    
                    <div class="probabilities">
                        <h4 style="margin-bottom: 15px; color: #333;">各类别概率分布</h4>
                        <div id="probabilitiesContainer"></div>
                    </div>
                    
                    <div class="single-models">
                        <h4 style="margin-bottom: 15px; color: #333;">单模型预测详情</h4>
                        <div id="singleModelsContainer"></div>
                    </div>
                </div>
                
                <div class="model-info">
                    <h4>模型信息</h4>
                    <p>集成模型数量: <span id="modelCount">-</span></p>
                    <p>推理设备: <span id="deviceInfo">-</span></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewImage = document.getElementById('previewImage');
        const predictBtn = document.getElementById('predictBtn');
        const loading = document.getElementById('loading');
        const resultSection = document.getElementById('resultSection');
        const errorMessage = document.getElementById('errorMessage');
        
        let selectedFile = null;
        
        // 上传区域点击
        uploadArea.addEventListener('click', () => fileInput.click());
        
        // 文件选择
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });
        
        // 拖拽上传
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });
        
        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                showError('请选择图片文件');
                return;
            }
            
            selectedFile = file;
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                previewImage.style.display = 'block';
                predictBtn.disabled = false;
                hideError();
            };
            reader.readAsDataURL(file);
        }
        
        // 预测按钮
        predictBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            
            const formData = new FormData();
            formData.append('image', selectedFile);
            
            loading.style.display = 'block';
            resultSection.style.display = 'none';
            predictBtn.disabled = true;
            hideError();
            
            try {
                const response = await fetch('/api/predict', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.error) {
                    showError(data.error);
                } else {
                    displayResults(data);
                }
            } catch (error) {
                showError('推理失败: ' + error.message);
            } finally {
                loading.style.display = 'none';
                predictBtn.disabled = false;
            }
        });
        
        function displayResults(data) {
            // 预测结果
            document.getElementById('predictionClass').textContent = 
                `${data.prediction.class_cn} (${data.prediction.class})`;
            document.getElementById('predictionConfidence').textContent = 
                `置信度: ${(data.prediction.confidence * 100).toFixed(2)}%`;
            
            // 热力图
            if (data.heatmap_base64) {
                const heatmapImage = document.getElementById('heatmapImage');
                heatmapImage.src = `data:image/png;base64,${data.heatmap_base64}`;
                heatmapImage.style.display = 'block';
            }
            
            // 概率分布
            const probContainer = document.getElementById('probabilitiesContainer');
            probContainer.innerHTML = '';
            
            const sortedProbs = Object.entries(data.all_probabilities_cn)
                .sort((a, b) => b[1] - a[1]);
            
            sortedProbs.forEach(([className, prob]) => {
                const percentage = (prob * 100).toFixed(2);
                const probItem = document.createElement('div');
                probItem.className = 'prob-item';
                probItem.innerHTML = `
                    <div class="prob-label">${className}</div>
                    <div class="prob-bar-container">
                        <div class="prob-bar" style="width: ${percentage}%">
                            <span class="prob-value">${percentage}%</span>
                        </div>
                    </div>
                `;
                probContainer.appendChild(probItem);
            });
            
            // 单模型预测
            const singleModelsContainer = document.getElementById('singleModelsContainer');
            singleModelsContainer.innerHTML = '';
            
            data.single_model_predictions.forEach(model => {
                const item = document.createElement('div');
                item.className = 'single-model-item';
                item.innerHTML = `
                    <span class="single-model-name">${model.model}</span>
                    <span class="single-model-pred">${model.prediction_cn} (${(model.confidence * 100).toFixed(1)}%)</span>
                `;
                singleModelsContainer.appendChild(item);
            });
            
            // 模型信息
            document.getElementById('modelCount').textContent = data.model_count;
            
            resultSection.style.display = 'block';
        }
        
        function showError(msg) {
            errorMessage.textContent = msg;
            errorMessage.style.display = 'block';
        }
        
        function hideError() {
            errorMessage.style.display = 'none';
        }
        
        // 获取模型信息
        async function loadModelInfo() {
            try {
                const response = await fetch('/api/models');
                const data = await response.json();
                document.getElementById('modelCount').textContent = data.model_count;
                document.getElementById('deviceInfo').textContent = data.device;
            } catch (error) {
                console.error('获取模型信息失败:', error);
            }
        }
        
        loadModelInfo();
    </script>
</body>
</html>
